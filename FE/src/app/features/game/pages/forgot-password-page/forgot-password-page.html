<div class="fixed inset-0 z-0">
  <video id="fp-video" src="/assets/video/intro.webm" autoplay muted loop playsinline preload="auto" [muted]="isMuted" poster="/assets/img/Inicial.png" class="w-full h-full object-cover"></video>
  <div class="absolute inset-0" style="background: rgba(5,5,15,0.7)"></div>
</div>

<button id="mute-btn" class="fixed top-5 right-5 z-[100] w-11 h-11 flex items-center justify-center cursor-pointer text-white transition-all duration-300 hover:bg-white/20 hover:border-neon-cyan rounded-full" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);" (click)="toggleMute()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [style.display]="isMuted ? 'block' : 'none'" class="w-[22px] h-[22px]">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [style.display]="!isMuted ? 'block' : 'none'" class="w-[22px] h-[22px]">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>
</button>

<div class="fixed inset-0 z-10 flex items-center justify-center">
  <div class="bg-bg-secondary/80 backdrop-blur-[12px] border-2 border-neon-cyan rounded-2xl px-10 py-10 w-[360px] flex flex-col items-center gap-6"
       style="filter: drop-shadow(0 0 30px rgba(0,170,255,0.3));">

    <!-- Título traducido -->
    <h1 class="font-orbitron text-xl text-text-primary tracking-[3px] text-center">{{ 'FORGOT_PASSWORD.TITLE' | translate }}</h1>

    @if (!submitted) {
      <!-- Descripción traducida -->
      <p class="text-text-secondary font-share-tech text-sm text-center">
        {{ 'FORGOT_PASSWORD.DESCRIPTION' | translate }}
      </p>
      <form class="flex flex-col items-center gap-4 w-full" (ngSubmit)="onSubmit()" #forgotForm="ngForm">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'LOGIN.EMAIL' | translate"
          autocomplete="email"
          required
          class="w-full p-4 bg-black/40 border border-white/10 rounded text-text-primary font-share-tech text-sm transition-all duration-300 focus:outline-none focus:border-neon-cyan focus:shadow-[0_0_10px_rgba(0,170,255,0.2)]"
        >
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full p-4 border-0 rounded text-white font-orbitron text-sm tracking-[3px] cursor-pointer transition-all duration-300 uppercase hover:-translate-y-0.5 hover:shadow-[0_5px_20px_rgba(0,170,255,0.4)] disabled:opacity-50 disabled:cursor-not-allowed"
          style="background: linear-gradient(135deg, #00aaff, #ff3333)"
        >
          <!-- Estado de envío traducido -->
          {{ (isLoading ? 'FORGOT_PASSWORD.SENDING' : 'FORGOT_PASSWORD.SEND_LINK') | translate }}
        </button>
      </form>
    } @else {
      <p class="text-text-secondary font-share-tech text-sm text-center">
        {{ 'FORGOT_PASSWORD.SUCCESS_MSG' | translate }}
      </p>
    }

    <!-- Botón volver al login traducido -->
    <button
      type="button"
      (click)="goToLogin()"
      class="text-text-secondary font-share-tech text-xs tracking-[1px] bg-transparent border-0 cursor-pointer hover:text-neon-cyan transition-colors duration-200"
    >
      {{ 'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}
    </button>
  </div>
</div>
