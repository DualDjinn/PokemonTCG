<style>
  @keyframes my-skeleton-blink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
</style>
<div class="flex flex-col w-full" [style.gap]="gap">
  @for (index of lineList; track index) {
    <span
      class="block border-2 border-dashed"
      [style.height]="height"
      [style.width]="lineWidth(index)"
      [style.background]="color"
      [style.borderColor]="highlightColor"
      [style.animation]="'my-skeleton-blink 1s steps(2) infinite'"
    ></span>
  }
</div>
