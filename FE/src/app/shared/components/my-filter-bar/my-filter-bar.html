<div class="flex gap-1.5 flex-nowrap" role="tablist" [style.--filter-color]="color">
  @for (opt of options; track opt.value) {
    <button
      type="button"
      [class]="btnClass(opt.value)"
      [style.borderColor]="variant === 'modern' ? (selected === opt.value ? color : 'rgba(255,255,255,0.18)') : color"
      [style.--filter-color]="color"
      [style.background]="variant === 'modern' ? (selected === opt.value ? color : 'rgba(255,255,255,0.05)') : (selected === opt.value ? color : 'transparent')"
      [style.color]="variant === 'modern' ? (selected === opt.value ? '#ffffff' : '#cbd5e1') : (selected === opt.value ? '#050508' : 'inherit')"
      [style.boxShadow]="variant === 'modern' ? (selected === opt.value ? '0 0 14px ' + color + '66' : 'none') : (selected === opt.value ? '0 0 10px ' + color : 'none')"
      (click)="select(opt.value)"
    >
      @if (translate) {
        {{ opt.label | translate }}
      } @else {
        {{ opt.label }}
      }
    </button>
  }
</div>
