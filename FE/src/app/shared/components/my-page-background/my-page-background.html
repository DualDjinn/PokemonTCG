<video
  class="bg-video"
  [src]="videoSrc"
  [attr.poster]="poster || null"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
></video>
<div class="bg-overlay"
     [style.background]="overlayMode === 'gradient'
       ? 'linear-gradient(180deg, rgba(18,18,30,0.25) 0%, rgba(5,5,8,' + overlayOpacity + ') 70%)'
       : 'rgba(5, 5, 8, ' + overlayOpacity + ')'"></div>
