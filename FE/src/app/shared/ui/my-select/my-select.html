@if (variant === 'pixel') {
  <select
    class="pixel-select"
    [value]="value"
    [disabled]="disabled"
    [style.color]="textColor"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    @if (placeholder) {
      <option value="" disabled hidden>{{ placeholder }}</option>
    }
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
} @else if (variant === 'modern') {
  <select
    class="my-select--modern text-sm rounded-xl px-3.5 py-2 outline-none cursor-pointer w-full appearance-none border transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
    [value]="value"
    [disabled]="disabled"
    [style.color]="textColor"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    @if (placeholder) {
      <option value="" disabled hidden>{{ placeholder }}</option>
    }
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
} @else {
  <select
    class="text-xs font-pixel border-[3px] border-dashed px-[0.85rem] py-[0.65rem] outline-none cursor-pointer w-full appearance-none disabled:opacity-50 disabled:cursor-not-allowed"
    [value]="value"
    [disabled]="disabled"
    [style.color]="textColor"
    [style.background]="background"
    [style.borderColor]="color"
    [style.boxShadow]="'4px 4px 0px ' + color"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    @if (placeholder) {
      <option value="" disabled hidden>{{ placeholder }}</option>
    }
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
}
