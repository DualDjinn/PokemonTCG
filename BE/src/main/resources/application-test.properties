## Spring Data Source - Test (H2 in-memory) ##
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## Spring JPA - Test ##
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

## DevTools - Test ##
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

## App properties (required by SpringDocConfig) ##
app.name=test-app
app.desc=Test description
app.version=0.0.0
app.url=http://localhost:8080
app.dev-name=Test Dev
app.dev-email=test@test.com
app.frontend-url=http://localhost:4200

## Google Sign-In stub para tests ##
app.google.client-id=test-client-id

## Mail - Test (dummy values, no real SMTP) ##
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

