# Local development credentials — never commit this file.
spring.profiles.active=dev

# MySQL
MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:}
MYSQL_DATABASE=${MYSQL_DATABASE:}

# MinIO
MINIO_ROOT_USER=${MINIO_ROOT_USER:}
MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:}
## Spring Data Source - Dev (MySQL) ##
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}

## Spring JPA - Dev ##
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

## MinIO ##
app.minio.url=${MINIO_URL:}
app.minio.access-key=${MINIO_ACCESS_KEY:}
app.minio.secret-key=${MINIO_SECRET_KEY:}
app.minio.bucket=${MINIO_BUCKET:}

logging.level.root=WARN
logging.level.ar.edu.utn.frc.tup.piii.configs=DEBUG
logging.level.ar.edu.utn.frc.tup.piii.services.EmailService=DEBUG
logging.level.ar.edu.utn.frc.tup.piii.services.adapters.MercadoPagoAdapter=INFO
logging.level.org.springframework.mail=DEBUG

## Google Sign-In ##
app.google.client-id=${GOOGLE_CLIENT_ID:}

## MercadoPago Checkout Pro ##
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.sandbox=false
app.mercadopago.success-url=${MERCADOPAGO_SUCCESS_URL:}
app.mercadopago.failure-url=${MERCADOPAGO_FAILURE_URL:}
app.mercadopago.pending-url=${MERCADOPAGO_PENDING_URL:}
app.mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}

## Spring Mail ##
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
## Pokemon TCG API ##
app.pokemon-api.base-url=https://api.pokemontcg.io/v2
app.pokemon-api.api-key=${POKEMON_TCG_API_KEY:}
app.pokemon-api.set-ids=xy1
app.pokemon-api.page-size=250
# "-" deshabilita el cron (Scheduled.CRON_DISABLED); un valor vacío rompe el arranque.
app.pokemon-api.sync-cron=-
app.pokemon-api.connect-timeout-ms=5000
app.pokemon-api.read-timeout-ms=30000

## WebSocket / CORS ##
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:}

## App metadata (SpringDoc / OpenAPI) ##
app.name=Pokemon TCG live G07
app.desc=Pokemon TCG digital game backend
app.version=0.0.1-SNAPSHOT
app.url=${APP_URL:}
app.dev-name=Grupo 07
app.dev-email=${APP_DEV_EMAIL:}
app.frontend-url=${FRONTEND_URL:}

## MinIO extra ##
app.minio.full-art-bucket=${MINIO_FULL_ART_BUCKET:}
