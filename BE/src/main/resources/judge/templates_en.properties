# ============================================================
# Judge Assistant — Response templates in English (XY1)
# ============================================================
# Positional parameters: {0}, {1}, {2}, ...
# Each block documents the meaning of each parameter.
# ============================================================

# ---- Wrong phase ----
# {0} = Pokemon name or action attempted
ACTION_BLOCKED_WRONG_PHASE={0} cannot be performed during this turn phase. Check which phase you are currently in.

# ---- Attack blocked ----
# {0} = attacking Pokemon name
ACTION_BLOCKED_CANT_ATTACK_STATUS_SLEEP={0} cannot attack because it is Asleep. A coin flip at end of turn determines whether it wakes up (heads = wake up).
# {0} = attacking Pokemon name
ACTION_BLOCKED_CANT_ATTACK_STATUS_PARALYZED={0} cannot attack because it is Paralyzed. Paralysis is automatically removed at the end of this turn.
# {0} = attacking Pokemon name
ACTION_BLOCKED_CANT_ATTACK_FLAG={0} cannot attack this turn due to an effect from a previous attack.
# {0} = attacking Pokemon name, {1} = blocked attack name
ACTION_BLOCKED_CANT_ATTACK_SPECIFIC_NAME={0} cannot use the attack "{1}" this turn.
# {0} = attacking Pokemon name, {1} = attack name, {2} = required energy, {3} = available energy
ACTION_BLOCKED_CANT_ATTACK_ENERGY={0} does not have enough energy to use that attack. "{1}" requires {2} energy card(s) and only {3} are attached.

# ---- Retreat blocked ----
# {0} = active Pokemon name, {1} = retreat cost, {2} = available energy
ACTION_BLOCKED_CANT_RETREAT_ENERGY={0} cannot retreat because it does not have enough energy. Retreat cost is {1} and only {2} energy card(s) are attached.
# {0} = active Pokemon name
ACTION_BLOCKED_CANT_RETREAT_FLAG={0} cannot retreat this turn due to an opponent card effect.
# {0} = active Pokemon name
ACTION_BLOCKED_CANT_RETREAT_STATUS_PARALYZED={0} cannot retreat because it is Paralyzed. Paralysis is removed at the end of this turn.
# {0} = active Pokemon name
ACTION_BLOCKED_CANT_RETREAT_STATUS_SLEEP={0} cannot retreat because it is Asleep.
ACTION_BLOCKED_RETREAT_ALREADY_USED=You already retreated a Pokemon this turn. You may only retreat once per turn.

# ---- Supporter blocked ----
ACTION_BLOCKED_CANT_PLAY_SUPPORTER_QUOTA=You already played a Supporter card this turn. Only one Supporter can be played per turn.
# {0} = opponent's active Pokemon name
ACTION_BLOCKED_CANT_PLAY_SUPPORTER_FLAG=You cannot play Supporter cards this turn because of {0}'s effect.

# ---- Evolution blocked ----
# {0} = base Pokemon name
ACTION_BLOCKED_CANT_EVOLVE_FIRST_TURN={0} cannot evolve during the first turn of the match.
# {0} = base Pokemon name
ACTION_BLOCKED_CANT_EVOLVE_PLAYED_THIS_TURN={0} was put into play this turn. You can only evolve a Pokemon that has been in play since your previous turn.

# ---- Energy blocked ----
ACTION_BLOCKED_CANT_ATTACH_ENERGY_QUOTA=You already used your manual energy attachment for this turn. Only 1 energy may be attached manually per turn.

# ---- Bench full ----
ACTION_BLOCKED_BENCH_FULL=Your Bench is full. You cannot put more Pokemon on the Bench (maximum 5).

# ---- Damage resolution ----
# {0} = attacker name, {1} = attack name, {2} = final damage, {3} = defender name
# {4} = base damage, {5} = damage after effect, {6} = calculated damage (W/R)
DAMAGE_FINAL_APPLIED={0} used {1} and dealt {2} damage to {3}. (Base: {4} | After effect: {5} | After Weakness/Resistance: {6} | Final: {2}.)
# {0} = attacker name, {1} = attack name, {2} = defender name
DAMAGE_FINAL_ZERO={0} used {1} but {2} received no damage. Active protection cancelled all damage.

# ---- Special condition applied / cured ----
# {0} = affected Pokemon name, {1} = status name, {2} = source (attack or "end of turn")
STATUS_APPLIED={0} is now {1}, applied by {2}.
# {0} = affected Pokemon name, {1} = status name, {2} = cure reason
STATUS_CURED={0} is no longer {1}. Reason: {2}.

# ---- Knockout ----
# {0} = knocked-out Pokemon name, {1} = damage taken, {2} = max HP, {3} = prizes awarded
POKEMON_KO_BY_DAMAGE={0} was Knocked Out with {1} damage taken (max HP: {2}). Your opponent takes {3} Prize card(s).

# ---- Victory ----
# {0} = winner name
VICTORY_PRIZES_DEPLETED={0} won the match by taking all their Prize cards.
# {0} = winner name
VICTORY_NO_POKEMON_REMAINING={0} won the match because the opponent has no more Pokemon to send out.
# {0} = winner name
VICTORY_DECK_OUT={0} won the match because the opponent could not draw a card at the start of their turn (deck-out).
