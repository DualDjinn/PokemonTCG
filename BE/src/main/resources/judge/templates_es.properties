# ============================================================
# Judge Assistant — Plantillas de respuesta en Español (XY1)
# ============================================================
# Parametros posicionales: {0}, {1}, {2}, ...
# Cada bloque documenta el significado de cada parametro.
# ============================================================

# ---- Fase incorrecta ----
# {0} = nombre del Pokemon o accion intentada
ACTION_BLOCKED_WRONG_PHASE={0} no puede realizarse en esta fase del turno. Revisa en que fase del turno te encontras.

# ---- Ataque bloqueado ----
# {0} = nombre del Pokemon atacante
ACTION_BLOCKED_CANT_ATTACK_STATUS_SLEEP={0} no puede atacar porque esta dormido. Al final del turno se lanza una moneda: si sale cara se despierta.
# {0} = nombre del Pokemon atacante
ACTION_BLOCKED_CANT_ATTACK_STATUS_PARALYZED={0} no puede atacar porque esta paralizado. La paralisis se quita automaticamente al final de este turno.
# {0} = nombre del Pokemon atacante
ACTION_BLOCKED_CANT_ATTACK_FLAG={0} no puede atacar este turno a causa del efecto de un ataque anterior.
# {0} = nombre del Pokemon atacante, {1} = nombre del ataque bloqueado
ACTION_BLOCKED_CANT_ATTACK_SPECIFIC_NAME={0} no puede usar el ataque "{1}" este turno.
# {0} = nombre del Pokemon atacante, {1} = nombre del ataque, {2} = energia requerida, {3} = energia disponible
ACTION_BLOCKED_CANT_ATTACK_ENERGY={0} no tiene suficiente energia para usar ese ataque. El ataque "{1}" requiere {2} energia(s) y solo tiene {3}.

# ---- Retiro bloqueado ----
# {0} = nombre del Pokemon activo, {1} = costo de retiro, {2} = energia disponible
ACTION_BLOCKED_CANT_RETREAT_ENERGY={0} no puede retirarse porque no tiene suficiente energia. El costo de retiro es {1} y solo tiene {2} energia(s) adjuntada(s).
# {0} = nombre del Pokemon activo
ACTION_BLOCKED_CANT_RETREAT_FLAG={0} no puede retirarse este turno a causa del efecto de una carta del oponente.
# {0} = nombre del Pokemon activo
ACTION_BLOCKED_CANT_RETREAT_STATUS_PARALYZED={0} no puede retirarse porque esta paralizado. La paralisis se quita al final de este turno.
# {0} = nombre del Pokemon activo
ACTION_BLOCKED_CANT_RETREAT_STATUS_SLEEP={0} no puede retirarse porque esta dormido.
ACTION_BLOCKED_RETREAT_ALREADY_USED=Ya retiraste un Pokemon este turno. Solo se puede retirar una vez por turno.

# ---- Supporter bloqueado ----
ACTION_BLOCKED_CANT_PLAY_SUPPORTER_QUOTA=Ya jugaste un Supporter este turno. Solo podes jugar uno por turno.
# {0} = nombre del Pokemon activo del oponente
ACTION_BLOCKED_CANT_PLAY_SUPPORTER_FLAG=No podes jugar Supporters este turno porque el efecto de {0} lo impide.

# ---- Evolucion bloqueada ----
# {0} = nombre del Pokemon base
ACTION_BLOCKED_CANT_EVOLVE_FIRST_TURN={0} no puede evolucionar durante el primer turno de la partida.
# {0} = nombre del Pokemon base
ACTION_BLOCKED_CANT_EVOLVE_PLAYED_THIS_TURN={0} entro en juego este turno. Solo podes evolucionar un Pokemon que haya estado en juego desde el turno anterior.

# ---- Energia bloqueada ----
ACTION_BLOCKED_CANT_ATTACH_ENERGY_QUOTA=Ya adjuntaste tu energia manual de este turno. Solo se puede adjuntar 1 por turno de forma manual.

# ---- Banco lleno ----
ACTION_BLOCKED_BENCH_FULL=Tu banco esta lleno. No podes poner mas Pokemon en el banco (maximo 5).

# ---- Resolucion de dano ----
# {0} = nombre del Pokemon atacante, {1} = nombre del ataque, {2} = dano final, {3} = nombre del defensor
# {4} = dano base, {5} = dano tras efecto, {6} = dano calculado (W/R)
DAMAGE_FINAL_APPLIED={0} uso {1} e hizo {2} de dano a {3}. (Base: {4} | Tras efecto: {5} | Tras debilidad/resistencia: {6} | Final: {2}.)
# {0} = nombre del atacante, {1} = nombre del ataque, {2} = nombre del defensor
DAMAGE_FINAL_ZERO={0} uso {1} pero {2} no recibio dano. La proteccion activa cancelo el dano completamente.

# ---- Condicion especial aplicada / curada ----
# {0} = nombre del Pokemon afectado, {1} = nombre del estado, {2} = fuente (ataque o "fin de turno")
STATUS_APPLIED={0} ahora tiene el estado {1}, aplicado por {2}.
# {0} = nombre del Pokemon afectado, {1} = nombre del estado, {2} = razon de la cura
STATUS_CURED={0} ya no tiene el estado {1}. Razon: {2}.

# ---- KO ----
# {0} = nombre del Pokemon derrotado, {1} = dano tomado, {2} = HP maximo, {3} = premios otorgados
POKEMON_KO_BY_DAMAGE={0} fue derrotado con {1} de dano (HP maximo: {2}). El oponente tomo {3} carta(s) de premio.

# ---- Victoria ----
# {0} = nombre del ganador
VICTORY_PRIZES_DEPLETED={0} gano la partida al tomar todos sus premios.
# {0} = nombre del ganador
VICTORY_NO_POKEMON_REMAINING={0} gano la partida porque el rival no tiene mas Pokemon con que continuar.
# {0} = nombre del ganador
VICTORY_DECK_OUT={0} gano la partida porque el rival no pudo robar una carta al inicio de su turno (deck-out).
